services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: serv60
      POSTGRES_USER: serv60
      POSTGRES_PASSWORD: serv60-local-only
    ports:
      - "5432:5432"
    volumes:
      - serv60-postgres-v2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serv60 -d serv60"]
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: af-south-1
    ports:
      - "4566:4566"
    volumes:
      - serv60-localstack:/var/lib/localstack
  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/serv60
      DB_USERNAME: serv60
      DB_PASSWORD: serv60-local-only
      SERV60_EXPRESS_PRICE_MINOR: ${SERV60_EXPRESS_PRICE_MINOR:-24900}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SERV60_ASSISTANT_MODEL: ${SERV60_ASSISTANT_MODEL:-}
      SECURITY_ENABLED: "false"
      SERV60_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OUTBOX_SQS_ENABLED: "false"
      # Demo floor: set SERV60_DEMO_FLOOR_SIMULATION=true to let visits advance on their own.
      SERV60_DEMO_FLOOR_SIMULATION: ${SERV60_DEMO_FLOOR_SIMULATION:-false}
      SERV60_DEMO_FLOOR_STAGE_SECONDS: ${SERV60_DEMO_FLOOR_STAGE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
  operations-web:
    build:
      context: ../operations-web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        # The local backend runs with security off, so staff enter with an email.
        NEXT_PUBLIC_SERV60_DEMO_MODE: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  serv60-postgres-v2:
  serv60-localstack:
