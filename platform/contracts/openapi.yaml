openapi: 3.1.0
info:
  title: Serv60 Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - clerkJwt: []
paths:
  /v1/customer/hubs:
    get:
      operationId: listNearbyHubs
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number}}
        - {name: longitude, in: query, required: true, schema: {type: number}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 80}}
      responses:
        '200': {description: Published hubs within 20 km}
  /v1/customer/hubs/{hubId}:
    get:
      operationId: getCustomerHub
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Published hub detail}
  /v1/customer/hubs/{hubId}/slots:
    get:
      operationId: listCustomerSlots
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: complimentaryServiceCode, in: query, required: false, schema: {type: string}}
        - {name: replacing, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Feasible hourly slots}
  /v1/customer/appointments:
    get:
      operationId: listCustomerAppointments
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 20}}
        - {name: after, in: query, schema: {type: string, format: date-time}}
        - {name: afterId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Upcoming owned appointments}
    post:
      operationId: createCustomerAppointment
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: Hold created}
  /v1/customer/appointments/{id}:
    put:
      operationId: changeCustomerAppointment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Appointment changed}
  /v1/customer/appointments/{id}/payment:
    post:
      operationId: payCustomerAppointment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Server-priced payment order}
  /v1/customer/appointments/{id}/confirm-payment:
    put:
      operationId: confirmCustomerPayment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Confirmed after PAID order}
  /v1/customer/appointments/{id}/cancel:
    post:
      operationId: cancelCustomerAppointment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Cancelled hold or confirmed visit under notice policy}
  /v1/customer/profile:
    get:
      operationId: getCustomerProfile
      responses:
        '200': {description: Profile and vehicles}
    put:
      operationId: saveCustomerProfile
      responses:
        '200': {description: Saved profile}
  /v1/customer/roadside/nearby:
    get:
      operationId: nearbyTowTrucks
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number}}
        - {name: longitude, in: query, required: true, schema: {type: number}}
      responses:
        '200': {description: Nearby online tow partners}
  /v1/customer/roadside/incidents:
    post:
      operationId: createRoadsideGeoIncident
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: Incident with tow quotes}
        '400': {description: Invalid coordinates, half a destination, a destination beyond the tow range, or a vehicle not on the customer's profile}
        '409': {description: Idempotency-Key reused with a different request, or the customer already has the maximum open requests}
  /v1/customer/roadside/incidents/{id}:
    get:
      operationId: getRoadsideIncidentDetail
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Incident detail with quotes, truck and ride leg}
  /v1/customer/roadside/incidents/{id}/accept-quote:
    post:
      operationId: acceptRoadsideQuote
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Quote accepted and the amount recorded as due (not paid). The incident waits in SEARCHING until a dispatcher confirms the truck}
        '409': {description: Quote expired, the partner has no free truck, or the request no longer accepts quotes}
  /v1/customer/roadside/incidents/{id}/ride:
    post:
      operationId: startRoadsideRide
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ride-home leg requested and added to the amount due; the dispatcher arranges it (no ride provider is integrated)}
        '409': {description: The request is closed}
  /v1/hubs/{hubId}/settings:
    get:
      operationId: getHubSettings
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Capacity and trading hours}
    put:
      operationId: updateHubSettings
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Saved settings}
        '409': {description: Revision or allocation conflict}
  /v1/roadside/incidents/dispatch/board:
    get:
      operationId: roadsideDispatchBoard
      description: Operator of the hub only. Lists that hub's open incidents with the nearest online partner. Incidents with no hub are on the unrouted board.
      parameters:
        - {name: hubId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        '200': {description: Incidents with pins, truck, ride status and nearest partner}
        '403': {description: Not an operator of this hub}
  /v1/roadside/incidents/dispatch/unrouted:
    get:
      operationId: roadsideUnroutedBoard
      description: ADMIN only. Open incidents raised while no hub was published.
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        '200': {description: Incidents with no hub}
        '403': {description: Not an ADMIN}
  /v1/roadside/incidents/{id}/dispatch:
    post:
      operationId: confirmRoadsideDispatch
      description: Operator of the incident's hub. Confirms the accepted partner's truck is on its way after the dispatcher has called them. Repeating it after success replays the current state.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etaMinutes]
              properties:
                etaMinutes: {type: integer, minimum: 1, maximum: 240}
      responses:
        '200': {description: Incident is EN_ROUTE with the partner's truck}
        '403': {description: Not an operator of this hub}
        '409': {description: No accepted quote is waiting for dispatch}
  /v1/roadside/incidents/{id}/progress:
    post:
      operationId: recordRoadsideProgress
      description: Operator of the incident's hub. Allowed steps are ASSIGNED to EN_ROUTE or ON_SCENE, EN_ROUTE to ON_SCENE, ON_SCENE to TOWING or COMPLETED, and TOWING to COMPLETED. Repeating the current status is a no-op.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [EN_ROUTE, ON_SCENE, TOWING, COMPLETED]}
      responses:
        '200': {description: Incident detail with the new status}
        '403': {description: Not an operator of this hub}
        '409': {description: That step is not allowed from the current status}
  /v1/hubs/{hubId}/availability:
    get:
      operationId: listAvailability
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: serviceCode, in: query, required: true, schema: {type: string}}
        - {name: complimentaryServiceCode, in: query, required: false, schema: {type: string, enum: [BARBER, PRIVATE_WORK]}, description: One complimentary option during EXPRESS_OIL; both resources must be available.}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}, description: Exclusive end; at most 7 days after from.}
      responses:
        '200':
          description: Every feasible start in [from, to) on a 15-minute grid from each day's opening time, inside trading hours.
        '400': {description: Empty or longer than 7-day range, or invalid complimentary option}
  /v1/visit-holds:
    post:
      operationId: createVisitHold
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateHold'}
      responses:
        '201': {description: Hold created or replayed}
        '409': {description: Resource conflict}
  /v1/hubs/{hubId}/parts-readiness:
    get:
      operationId: listPartsReadiness
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Bounded parts readiness worklist
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PartsReadiness'}
        '400': {description: Invalid limit}
  /v1/hubs/{hubId}/calendar:
    get:
      operationId: getHubCalendar
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Allocated hub resources in the requested range
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CalendarEntry'}
        '400': {description: Invalid or oversized calendar range}
  /v1/hubs/{hubId}/appointments/{id}/details:
    get:
      operationId: getAppointmentDetails
      description: Hub operators only. Contact is a snapshot supplied for the visit. Responses must not be cached.
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Appointment details, with null contact for older bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdId: {type: string, format: uuid}
                  contact: {$ref: '#/components/schemas/AppointmentContact'}
                  complimentaryServiceCode: {type: string, nullable: true}
        '403': {description: Operator role or hub membership missing}
        '404': {description: Appointment does not exist in the authorized hub}
  /v1/visit-holds/{id}/confirm:
    post:
      operationId: confirmVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Confirmed booking}
        '409': {description: Expired or unavailable hold}
  /v1/visit-holds/{id}:
    get:
      operationId: getVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current visit hold status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hold'}
        '404': {description: Visit hold not found}
  /v1/visit-holds/{id}/cancel:
    post:
      operationId: cancelVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Cancelled booking, or an idempotent replay of cancellation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hold'}
        '409': {description: Visit hold is no longer cancellable}
  /v1/payments:
    post:
      operationId: createPaymentOrder
      description: Operator only, because the amount is client-supplied. Customers use POST /v1/customer/appointments/{id}/payment, which prices the visit on the server.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePayment'}
      responses:
        '201':
          description: Payment order created or replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
        '403': {description: Caller is not an operator, or customer ownership denied}
        '409': {description: The visit is already paid, or the key was reused with a different request}
  /v1/payments/{id}:
    get:
      operationId: getPaymentOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current provider-neutral payment order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
        '403': {description: Customer ownership denied}
        '404': {description: Payment order not found}
  /v1/payments/{id}/checkout:
    post:
      operationId: startPaymentCheckout
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Hosted checkout URL ready to open
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
        '403': {description: Customer ownership denied}
        '404': {description: Payment order not found}
  /v1/payments/webhooks/yoco:
    post:
      operationId: receiveYocoWebhook
      security: []
      parameters:
        - {name: webhook-id, in: header, required: true, schema: {type: string}}
        - {name: webhook-timestamp, in: header, required: true, schema: {type: string}}
        - {name: webhook-signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: Signed event accepted or idempotently replayed}
        '400': {description: Invalid signature or event}
  /v1/roadside/incidents:
    get:
      operationId: listRoadsideIncidents
      parameters:
        - {name: customerId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: Active incidents for the customer}
        '403': {description: Customer ownership denied}
    post:
      operationId: createRoadsideIncident
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIncident'}
      responses:
        '201': {description: Roadside incident created or replayed}
        '403': {description: Not an operator of the given hub. Customers use /v1/customer/roadside/incidents}
        '409': {description: Idempotency-Key reused with a different request, or the customer already has the maximum open requests}
  /v1/roadside/incidents/dispatch:
    get:
      operationId: listRoadsideDispatchQueue
      parameters:
        - {name: hubId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Open roadside incidents awaiting dispatch}
        '403': {description: Hub operator role required}
  /v1/roadside/incidents/{id}:
    get:
      operationId: getRoadsideIncident
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current roadside incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '404': {description: Incident not found}
  /v1/roadside/incidents/{id}/cancel:
    post:
      operationId: cancelRoadsideIncident
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Incident cancelled or idempotent replay. Any amount due is voided}
        '403': {description: Neither the customer nor an operator of the incident's hub}
        '409': {description: A customer cancelling after the truck was confirmed (only the hub may), or the incident is already closed}
        '404': {description: Incident not found}
  /v1/roadside/incidents/{id}/assignment:
    post:
      operationId: assignRoadsideRecovery
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, quoteReference, amountMinor, currency, estimatedMinutes]
              properties:
                provider: {type: string}
                quoteReference: {type: string}
                amountMinor: {type: integer, minimum: 0}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                estimatedMinutes: {type: integer, minimum: 1, maximum: 1440}
                rideHome: {type: boolean, default: false}
      responses:
        '200': {description: Recovery assignment created}
        '403': {description: Hub operator role required}
        '404': {description: Incident not found}
        '409': {description: Incident is no longer assignable}
  /v1/customer/appointments/{id}/progress:
    get:
      operationId: getCustomerVisitProgress
      summary: The customer's visit on the floor; stage is null until check-in
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Visit progress, content: {application/json: {schema: {$ref: '#/components/schemas/VisitProgress'}}}}
        '404': {description: Not the caller's appointment}
  /v1/customer/appointments/{id}/scope-changes/{scopeId}/decision:
    put:
      operationId: decideScopeChange
      summary: Approve or decline extra work proposed by the hub
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: scopeId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}
      responses:
        '200': {description: Updated visit progress, content: {application/json: {schema: {$ref: '#/components/schemas/VisitProgress'}}}}
        '409': {description: Already decided}
  /v1/hubs/{hubId}/floor:
    get:
      operationId: getHubFloor
      summary: Today's confirmed visits at the hub plus any car still on the floor (operator)
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Floor board rows ordered by start time, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FloorVisit'}}}}}
  /v1/hubs/{hubId}/visits/{id}/check-in:
    post:
      operationId: checkInVisit
      summary: Record the customer's arrival; starts the 60-minute target (operator)
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {note: {type: string, maxLength: 300}}}}}
      responses:
        '200': {description: The visit's floor row, content: {application/json: {schema: {$ref: '#/components/schemas/FloorVisit'}}}}
        '409': {description: Not confirmed, or already checked in}
  /v1/hubs/{hubId}/visits/{id}/stages:
    post:
      operationId: recordVisitStage
      summary: Record the next stage; only the stage after the current one is accepted (operator)
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordStage'}}}
      responses:
        '200': {description: The visit's floor row, content: {application/json: {schema: {$ref: '#/components/schemas/FloorVisit'}}}}
        '409': {description: Out of order, or the visit was handed over}
  /v1/hubs/{hubId}/visits/{id}/scope-changes:
    post:
      operationId: proposeScopeChange
      summary: Propose extra work to the customer (operator)
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProposeScopeChange'}}}
      responses:
        '201': {description: The proposal, content: {application/json: {schema: {$ref: '#/components/schemas/ScopeChange'}}}}
        '409': {description: Visit not confirmed, or already ready}
components:
  securitySchemes:
    clerkJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued OIDC access token (Google via Clerk)
  schemas:
    AppointmentContact:
      type: object
      nullable: true
      required: [customerName, phoneNumber]
      properties:
        customerName: {type: string, minLength: 1, maxLength: 160, description: From Clerk identity; not customer-editable}
        phoneNumber: {type: string, minLength: 1, maxLength: 32}
        email: {type: string, format: email, nullable: true, maxLength: 254, description: From Clerk identity}
        vehicleMake: {type: string, nullable: true, maxLength: 80}
        vehicleModel: {type: string, nullable: true, maxLength: 80}
        registration: {type: string, nullable: true, maxLength: 24}
    CreateHold:
      type: object
      required: [hubId, customerId, serviceCode, startsAt, endsAt]
      properties:
        contact: {$ref: '#/components/schemas/AppointmentContact'}
        hubId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid, nullable: true}
        serviceCode: {type: string}
        complimentaryServiceCode: {type: string, nullable: true, enum: [BARBER, PRIVATE_WORK], description: Optional free activity reserved inside the vehicle service hour.}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        policy: {type: string, enum: [READY_STOCK, CONDITIONAL_PROCUREMENT]}
    CreatePayment:
      type: object
      required: [customerId, holdId, amountMinor, currency, provider]
      properties:
        customerId: {type: string, format: uuid}
        holdId: {type: string, format: uuid}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string, pattern: '^[A-Za-z]{3}$'}
        provider: {type: string, pattern: '^[A-Za-z]+$'}
    PaymentOrder:
      type: object
      required: [id, customerId, holdId, amountMinor, currency, provider, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        holdId: {type: string, format: uuid}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string}
        provider: {type: string}
        status: {type: string, enum: [PENDING, PAID, FAILED, CANCELLED]}
        providerReference: {type: string, nullable: true}
        checkoutUrl: {type: string, format: uri, nullable: true}
        createdAt: {type: string, format: date-time}
    PartsReadiness:
      type: object
      required: [sku, usableQuantity, reservedQuantity, pendingDemand]
      properties:
        sku: {type: string}
        usableQuantity: {type: integer, minimum: 0}
        reservedQuantity: {type: integer, minimum: 0}
        pendingDemand: {type: integer, minimum: 0}
    Hold:
      type: object
      required: [id, hubId, customerId, serviceCode, startsAt, endsAt, status, policy, expiresAt]
      properties:
        id: {type: string, format: uuid}
        hubId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        serviceCode: {type: string}
        complimentaryServiceCode: {type: string, nullable: true, enum: [BARBER, PRIVATE_WORK], description: Optional free activity reserved inside the vehicle service hour.}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [HELD, CONFIRMED, CANCELLED, EXPIRED]}
        policy: {type: string, enum: [READY_STOCK, CONDITIONAL_PROCUREMENT]}
        expiresAt: {type: string, format: date-time}
    CalendarEntry:
      type: object
      required: [allocationId, holdId, resourceId, resourceCode, serviceCode, startsAt, endsAt, status]
      properties:
        allocationId: {type: string, format: uuid}
        holdId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        resourceCode: {type: string}
        serviceCode: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [HELD, CONFIRMED]}
    CreateIncident:
      type: object
      required: [customerId, location, description, hubId]
      properties:
        customerId: {type: string, format: uuid}
        hubId: {type: string, format: uuid, description: The hub that will handle the tow; the caller must operate it}
        vehicleId: {type: string, format: uuid, nullable: true}
        location: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, minLength: 1, maxLength: 2000}
    Incident:
      type: object
      required: [id, customerId, status, location, description, createdAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [OPEN, QUOTED, SEARCHING, ASSIGNED, EN_ROUTE, ON_SCENE, TOWING, COMPLETED, CANCELLED, EXPIRED]}
        location: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
    VisitStage:
      type: string
      description: Floor stages in order. The 60-minute target runs from CHECKED_IN to READY.
      enum: [CHECKED_IN, INSPECTING, SERVICING, QUALITY_CHECK, WASHING, READY, HANDED_OVER]
    StageEvent:
      type: object
      required: [stage, recordedAt]
      properties:
        stage: {$ref: '#/components/schemas/VisitStage'}
        recordedAt: {type: string, format: date-time}
        note: {type: string, nullable: true}
    ScopeItem:
      type: object
      required: [description, amountMinor]
      properties:
        description: {type: string, minLength: 1, maxLength: 160}
        amountMinor: {type: integer, format: int64, minimum: 0, description: ZAR cents}
    ProposeScopeChange:
      type: object
      required: [items]
      properties:
        items: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/ScopeItem'}}
        note: {type: string, maxLength: 500}
    ScopeChange:
      type: object
      required: [id, visitId, status, items, totalMinor, currency, proposedAt]
      properties:
        id: {type: string, format: uuid}
        visitId: {type: string, format: uuid}
        status: {type: string, enum: [PROPOSED, APPROVED, DECLINED]}
        items: {type: array, items: {$ref: '#/components/schemas/ScopeItem'}}
        note: {type: string, nullable: true}
        totalMinor: {type: integer, format: int64}
        currency: {type: string, example: ZAR}
        proposedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time, nullable: true}
    Decision:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVE, DECLINE]}
    RecordStage:
      type: object
      required: [stage]
      properties:
        stage: {$ref: '#/components/schemas/VisitStage'}
        note: {type: string, maxLength: 300}
    VisitProgress:
      type: object
      required: [visitId, hubName, startsAt, targetMinutes, events, scopeChanges]
      properties:
        visitId: {type: string, format: uuid}
        hubName: {type: string}
        startsAt: {type: string, format: date-time}
        complimentaryServiceCode: {type: string, nullable: true}
        stage: {allOf: [{$ref: '#/components/schemas/VisitStage'}], nullable: true, description: Null until check-in}
        checkedInAt: {type: string, format: date-time, nullable: true}
        readyAt: {type: string, format: date-time, nullable: true}
        handedOverAt: {type: string, format: date-time, nullable: true}
        targetMinutes: {type: integer, example: 60}
        elapsedMinutes: {type: integer, nullable: true, description: Minutes since check-in; frozen once ready; null before check-in}
        events: {type: array, items: {$ref: '#/components/schemas/StageEvent'}}
        scopeChanges: {type: array, items: {$ref: '#/components/schemas/ScopeChange'}}
        voucherCode: {type: string, nullable: true, description: Coffee voucher issued at check-in}
    FloorVisit:
      type: object
      required: [visitId, startsAt, endsAt, bookingStatus, targetMinutes, customerName, vehicle, pendingScopeChanges, approvedExtrasMinor, nextStages]
      properties:
        visitId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        bookingStatus: {type: string, enum: [CONFIRMED]}
        stage: {allOf: [{$ref: '#/components/schemas/VisitStage'}], nullable: true}
        checkedInAt: {type: string, format: date-time, nullable: true}
        readyAt: {type: string, format: date-time, nullable: true}
        handedOverAt: {type: string, format: date-time, nullable: true}
        elapsedMinutes: {type: integer, nullable: true}
        targetMinutes: {type: integer, example: 60}
        customerName: {type: string}
        vehicle: {type: string, description: Make and model}
        registration: {type: string, nullable: true}
        complimentaryServiceCode: {type: string, nullable: true}
        bayCode: {type: string, nullable: true}
        pendingScopeChanges: {type: integer}
        approvedExtrasMinor: {type: integer, format: int64}
        nextStages: {type: array, items: {$ref: '#/components/schemas/VisitStage'}, description: Empty once handed over}
