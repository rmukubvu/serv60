openapi: 3.1.0
info:
  title: Serv60 Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - cognitoJwt: []
paths:
  /v1/hubs/{hubId}/availability:
    get:
      operationId: listAvailability
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: serviceCode, in: query, required: true, schema: {type: string}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Feasible availability candidates
  /v1/visit-holds:
    post:
      operationId: createVisitHold
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateHold'}
      responses:
        '201': {description: Hold created or replayed}
        '409': {description: Resource conflict}
  /v1/hubs/{hubId}/parts-readiness:
    get:
      operationId: listPartsReadiness
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Bounded parts readiness worklist
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PartsReadiness'}
        '400': {description: Invalid limit}
  /v1/hubs/{hubId}/calendar:
    get:
      operationId: getHubCalendar
      parameters:
        - {name: hubId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Allocated hub resources in the requested range
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CalendarEntry'}
        '400': {description: Invalid or oversized calendar range}
  /v1/visit-holds/{id}/confirm:
    post:
      operationId: confirmVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Confirmed booking}
        '409': {description: Expired or unavailable hold}
  /v1/visit-holds/{id}:
    get:
      operationId: getVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current visit hold status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hold'}
        '404': {description: Visit hold not found}
  /v1/visit-holds/{id}/cancel:
    post:
      operationId: cancelVisitHold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Cancelled booking, or an idempotent replay of cancellation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hold'}
        '409': {description: Visit hold is no longer cancellable}
  /v1/roadside/incidents:
    post:
      operationId: createRoadsideIncident
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIncident'}
      responses:
        '201': {description: Roadside incident created or replayed}
        '403': {description: Customer ownership denied}
  /v1/roadside/incidents/{id}:
    get:
      operationId: getRoadsideIncident
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current roadside incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '404': {description: Incident not found}
  /v1/roadside/incidents/{id}/cancel:
    post:
      operationId: cancelRoadsideIncident
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Incident cancelled or idempotent replay}
        '403': {description: Customer ownership denied}
        '404': {description: Incident not found}
components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateHold:
      type: object
      required: [hubId, customerId, serviceCode, startsAt, endsAt]
      properties:
        hubId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid, nullable: true}
        serviceCode: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        policy: {type: string, enum: [READY_STOCK, CONDITIONAL_PROCUREMENT]}
    PartsReadiness:
      type: object
      required: [sku, usableQuantity, reservedQuantity, pendingDemand]
      properties:
        sku: {type: string}
        usableQuantity: {type: integer, minimum: 0}
        reservedQuantity: {type: integer, minimum: 0}
        pendingDemand: {type: integer, minimum: 0}
    Hold:
      type: object
      required: [id, hubId, customerId, serviceCode, startsAt, endsAt, status, policy, expiresAt]
      properties:
        id: {type: string, format: uuid}
        hubId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        serviceCode: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [HELD, CONFIRMED, CANCELLED, EXPIRED]}
        policy: {type: string, enum: [READY_STOCK, CONDITIONAL_PROCUREMENT]}
        expiresAt: {type: string, format: date-time}
    CalendarEntry:
      type: object
      required: [allocationId, holdId, resourceId, resourceCode, serviceCode, startsAt, endsAt, status]
      properties:
        allocationId: {type: string, format: uuid}
        holdId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        resourceCode: {type: string}
        serviceCode: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [HELD, CONFIRMED]}
    CreateIncident:
      type: object
      required: [customerId, location, description]
      properties:
        customerId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid, nullable: true}
        location: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, minLength: 1, maxLength: 2000}
    Incident:
      type: object
      required: [id, customerId, status, location, description, createdAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [OPEN]}
        location: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
