spring:
  application.name: serv60-platform
  # The outbox publisher and hold-expiry sweep must not queue behind each other on one thread.
  task.scheduling.pool.size: ${SERV60_SCHEDULER_THREADS:2}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serv60}
    username: ${DB_USERNAME:serv60}
    password: ${DB_PASSWORD:serv60-local-only}
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
  # Trace ids reach logs and REST calls always; spans are exported only when an OTLP endpoint is
  # set (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT).
  tracing.sampling.probability: ${SERV60_TRACE_SAMPLING:0.1}
  # The OTLP metrics registry would otherwise push to localhost every minute.
  otlp.metrics.export:
    enabled: ${SERV60_OTLP_METRICS_ENABLED:false}
    url: ${SERV60_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
logging:
  pattern.correlation: "[%X{traceId:-} %X{requestId:-}] "
server:
  shutdown: graceful
serv60:
  assistant:
    concurrent-turns: ${SERV60_ASSISTANT_CONCURRENT_TURNS:4}
    openrouter-key: ${OPENROUTER_API_KEY:}
    model: ${SERV60_ASSISTANT_MODEL:}
  cors:
    allowed-origins: ${SERV60_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    # Secure by default. Only local Compose and tests switch this off; production also needs
    # spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) or startup fails.
    enabled: ${SECURITY_ENABLED:true}
    # Comma-separated app client ids a token must be issued to (aud, client_id or azp). Empty
    # accepts any client of the issuer and logs a warning at startup.
    audiences: ${SERV60_SECURITY_AUDIENCES:}
    # Cognito custom:customer_id / custom:hub_ids are user-writable by default. Turn this on only
    # after removing every app client's write access to them.
    trust-cognito-custom-attributes: ${SERV60_SECURITY_TRUST_COGNITO_CUSTOM_ATTRIBUTES:false}
  booking:
    express-price-minor: ${SERV60_EXPRESS_PRICE_MINOR:0}
    # How long an unpaid reservation keeps its bay and parts (60-3600). Fifteen minutes covers a
    # hosted card checkout with 3-D Secure; a payment settling after it still confirms until the
    # expiry sweep releases the hold.
    hold-duration-seconds: ${HOLD_DURATION_SECONDS:900}
    # Starting payment extends the hold once to now + this, so 3-D Secure cannot lose the slot.
    checkout-grace-seconds: ${SERV60_CHECKOUT_GRACE_SECONDS:1200}
    expiry-sweep-ms: ${HOLD_EXPIRY_SWEEP_MS:30000}
    expiry-sweep-enabled: ${HOLD_EXPIRY_SWEEP_ENABLED:true}
    # Holds released per transaction; ten batches at most per sweep tick.
    expiry-batch-size: ${HOLD_EXPIRY_BATCH_SIZE:200}
    # Unpaid reservations one customer may hold at once; each blocks a real bay and parts.
    max-held-per-customer: ${SERV60_BOOKING_MAX_HELD_PER_CUSTOMER:3}
  roadside:
    ride-fallback-minor: ${SERV60_ROADSIDE_RIDE_FALLBACK_MINOR:8500}
    # Longest tow a customer may request to their own destination.
    max-tow-km: ${SERV60_ROADSIDE_MAX_TOW_KM:150}
    # Open requests one customer may have at once; also bounds what one account can put on a board.
    max-active-per-customer: ${SERV60_ROADSIDE_MAX_ACTIVE_PER_CUSTOMER:3}
    # Closes requests whose quotes all expired (quotes live ten minutes).
    expiry-sweep-ms: ${SERV60_ROADSIDE_EXPIRY_SWEEP_MS:60000}
    expiry-sweep-enabled: ${SERV60_ROADSIDE_EXPIRY_SWEEP_ENABLED:true}
  workshop:
    # Live floor and progress streams: keepalive comment cadence and how long one connection
    # stays open before the client reconnects.
    stream-heartbeat-ms: ${SERV60_WORKSHOP_STREAM_HEARTBEAT_MS:15000}
    stream-timeout-ms: ${SERV60_WORKSHOP_STREAM_TIMEOUT_MS:1800000}
  demo:
    floor-simulation:
      # Demo only: walks checked-in visits through the stages so the floor board and the app move
      # without a technician. Never enable for a real hub.
      enabled: ${SERV60_DEMO_FLOOR_SIMULATION:false}
      tick-ms: ${SERV60_DEMO_FLOOR_TICK_MS:5000}
      # Base unit: SERVICING takes twice this, CHECKED_IN a third; a visit reaches READY in about
      # 4.5 times this many seconds. Visits whose start passed are checked in on their own.
      stage-seconds: ${SERV60_DEMO_FLOOR_STAGE_SECONDS:60}
      auto-check-in: ${SERV60_DEMO_FLOOR_AUTO_CHECK_IN:true}
  outbox:
    # Published events older than this are deleted hourly; ops payment alerts read 30 days back.
    retention-days: ${SERV60_OUTBOX_RETENTION_DAYS:45}
    prune-enabled: ${SERV60_OUTBOX_PRUNE_ENABLED:true}
    sqs:
      enabled: ${OUTBOX_SQS_ENABLED:false}
      queue-url: ${OUTBOX_SQS_QUEUE_URL:}
      poll-ms: ${OUTBOX_SQS_POLL_MS:1000}
      # Attempts before an event is dead-lettered; with 30 s to 15 min backoff, 10 is about 75 minutes.
      max-attempts: ${OUTBOX_SQS_MAX_ATTEMPTS:10}
  payment:
    yoco:
      webhook-secret: ${SERV60_YOCO_WEBHOOK_SECRET:}
      webhook-max-skew-seconds: ${SERV60_YOCO_WEBHOOK_MAX_SKEW_SECONDS:180}
      api-base-url: ${SERV60_YOCO_API_BASE_URL:https://payments.yoco.com/api}
      api-key: ${SERV60_YOCO_API_KEY:}
      success-url: ${SERV60_YOCO_SUCCESS_URL:}
      cancel-url: ${SERV60_YOCO_CANCEL_URL:}
      connect-timeout-ms: ${SERV60_YOCO_CONNECT_TIMEOUT_MS:3000}
      # Must stay below the client's request deadline (15 s in the apps) so callers see a 503.
      read-timeout-ms: ${SERV60_YOCO_READ_TIMEOUT_MS:10000}
