spring:
  application.name: serv60-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serv60}
    username: ${DB_USERNAME:serv60}
    password: ${DB_PASSWORD:serv60-local-only}
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
server:
  shutdown: graceful
serv60:
  assistant:
    concurrent-turns: ${SERV60_ASSISTANT_CONCURRENT_TURNS:4}
    openrouter-key: ${OPENROUTER_API_KEY:}
    model: ${SERV60_ASSISTANT_MODEL:}
  cors:
    allowed-origins: ${SERV60_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    # Secure by default. Only local Compose and tests switch this off; production also needs
    # spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) or startup fails.
    enabled: ${SECURITY_ENABLED:true}
  booking:
    express-price-minor: ${SERV60_EXPRESS_PRICE_MINOR:0}
    # How long an unpaid reservation keeps its bay and parts (60-3600). Fifteen minutes covers a
    # hosted card checkout with 3-D Secure; a payment settling after it still confirms until the
    # expiry sweep releases the hold.
    hold-duration-seconds: ${HOLD_DURATION_SECONDS:900}
    expiry-sweep-ms: ${HOLD_EXPIRY_SWEEP_MS:30000}
    expiry-sweep-enabled: ${HOLD_EXPIRY_SWEEP_ENABLED:true}
  roadside:
    ride-fallback-minor: ${SERV60_ROADSIDE_RIDE_FALLBACK_MINOR:8500}
  outbox:
    sqs:
      enabled: ${OUTBOX_SQS_ENABLED:false}
      queue-url: ${OUTBOX_SQS_QUEUE_URL:}
      poll-ms: ${OUTBOX_SQS_POLL_MS:1000}
  payment:
    yoco:
      webhook-secret: ${SERV60_YOCO_WEBHOOK_SECRET:}
      webhook-max-skew-seconds: ${SERV60_YOCO_WEBHOOK_MAX_SKEW_SECONDS:180}
      api-base-url: ${SERV60_YOCO_API_BASE_URL:https://payments.yoco.com/api}
      api-key: ${SERV60_YOCO_API_KEY:}
      success-url: ${SERV60_YOCO_SUCCESS_URL:}
      cancel-url: ${SERV60_YOCO_CANCEL_URL:}
      connect-timeout-ms: ${SERV60_YOCO_CONNECT_TIMEOUT_MS:3000}
      # Must stay below the client's request deadline (15 s in the apps) so callers see a 503.
      read-timeout-ms: ${SERV60_YOCO_READ_TIMEOUT_MS:10000}
