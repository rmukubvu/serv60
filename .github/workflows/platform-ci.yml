name: Serv60 platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: platform/backend/target/site/jacoco

  operations-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/operations-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/operations-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: dart analyze

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f platform/infra/docker-compose.yml config
